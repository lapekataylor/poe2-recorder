name: PoE Recorder Flatpak

# Every push to main builds a test bundle (kept as a workflow artifact).
# Pushing a vX.Y.Z tag builds the same bundle and publishes it as a GitHub
# release. Bundles are unsigned; users install them with
# `flatpak install --user poe-recorder.flatpak`.

on:
  pull_request:
    paths:
      - '.github/workflows/flatpak-release.yml'
      - 'native/**'
      - 'flatpak/**'
      - 'data/**'
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

env:
  APP_ID: io.github.lapekataylor.PoeRecorder
  MANIFEST: flatpak/io.github.lapekataylor.PoeRecorder.yml

jobs:
  flatpak:
    name: Build Flatpak bundle
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: bash scripts/check-release-version.sh "$GITHUB_REF_NAME"
      - name: Build bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@401fe28a8384095fc1531b9d320b292f0ee45adb # v6.7
        with:
          manifest-path: ${{ env.MANIFEST }}
          bundle: poe-recorder.flatpak
          build-dir: build-flatpak
          repo-dir: repo
          branch: stable
          cache-key: flatpak-${{ hashFiles('native/Cargo.lock', 'flatpak/cargo-sources.json', env.MANIFEST) }}
          upload-artifact: false
      - name: Run sandbox smoke test
        run: bash scripts/flatpak-release-smoke.sh repo "$APP_ID"
      - name: Checksum
        run: sha256sum poe-recorder.flatpak > poe-recorder.flatpak.sha256
      - name: Upload bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: poe-recorder-flatpak
          path: |
            poe-recorder.flatpak
            poe-recorder.flatpak.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: flatpak
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
      - name: Download bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: poe-recorder-flatpak
          path: candidate
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## " v " " { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md
          cat >> notes.md <<'EOF'

          ### Install

          Download `poe-recorder.flatpak`, then run:

          ```sh
          flatpak install --user poe-recorder.flatpak
          ```
          EOF
          gh release create "$GITHUB_REF_NAME" \
            --title "PoE Recorder $version" \
            --notes-file notes.md \
            candidate/poe-recorder.flatpak \
            candidate/poe-recorder.flatpak.sha256
