app-id: io.github.lapekataylor.PoeRecorder.Devel
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: poe-recorder
separate-locales: false

finish-args:
  # Native Wayland display only; there is deliberately no X11 fallback.
  - --socket=wayland
  # Playback and recording audio use the sandbox PulseAudio/PipeWire bridge.
  - --socket=pulseaudio
  # Hardware decode/encode and rendering require DRM render nodes.
  - --device=dri
  # ksni registers only with the desktop's StatusNotifierWatcher.
  - --talk-name=org.kde.StatusNotifierWatcher

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib64/pkgconfig
  - /share/aclocal
  - /share/doc
  - /share/man
  - /share/locale

modules:
  - modules/ffmpeg.yml

  - modules/gpu-screen-recorder.yml

  - modules/clapper.yml

  - name: poe-recorder
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/poe-recorder/cargo
        CARGO_PROFILE_RELEASE_LTO: fat
        CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
    build-commands:
      - cargo --offline build --manifest-path native/Cargo.toml --release --features development
      - install -Dm755 native/target/release/poe-recorder /app/bin/poe-recorder
      - install -Dm644 data/io.github.lapekataylor.PoeRecorder.Devel.desktop /app/share/applications/io.github.lapekataylor.PoeRecorder.Devel.desktop
      - install -Dm644 data/io.github.lapekataylor.PoeRecorder.Devel.metainfo.xml /app/share/metainfo/io.github.lapekataylor.PoeRecorder.Devel.metainfo.xml
      - install -Dm644 data/icons/io.github.lapekataylor.PoeRecorder.Devel.svg /app/share/icons/hicolor/scalable/apps/io.github.lapekataylor.PoeRecorder.Devel.svg
      - install -Dm644 data/io.github.lapekataylor.PoeRecorder.Devel.gschema.xml /app/share/glib-2.0/schemas/io.github.lapekataylor.PoeRecorder.Devel.gschema.xml
      - glib-compile-schemas /app/share/glib-2.0/schemas
    sources:
      - type: dir
        path: ../native
        dest: native
        # Local cargo output: gigabytes the offline build does not need.
        skip:
          - target
          - poe2-log/target
      - type: dir
        path: ../data
        dest: data
      - cargo-sources.json
