app-id: io.github.lapekataylor.PoeRecorder
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: poe-recorder
separate-locales: false

finish-args:
  # GTK/GStreamer create many threads; two glibc arenas avoid retaining a
  # separate heap arena per thread after the 2,000-sidecar startup scan.
  - --env=MALLOC_ARENA_MAX=2
  # Native Wayland display only; there is deliberately no X11 fallback.
  - --socket=wayland
  # Playback and recording audio use the sandbox PulseAudio/PipeWire bridge.
  - --socket=pulseaudio
  # Hardware decode/encode and rendering require DRM render nodes.
  - --device=dri
  # ksni registers only with the desktop's StatusNotifierWatcher.
  - --talk-name=org.kde.StatusNotifierWatcher

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib64/pkgconfig
  - /share/aclocal
  - /share/doc
  - /share/man
  - /share/locale

cleanup-commands:
  # Flatpak-builder's default strip pass stages symbols in /app/lib/debug;
  # the stable channel does not publish a matching debug extension.
  - rm -rf /app/lib/debug

modules:
  - modules/ffmpeg.yml

  - modules/gpu-screen-recorder.yml

  - modules/clapper.yml

  - name: poe-recorder
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/poe-recorder/cargo
        CARGO_PROFILE_RELEASE_LTO: fat
        CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
    build-commands:
      - cargo --offline fmt --manifest-path native/Cargo.toml --check
      - cargo --offline clippy --manifest-path native/Cargo.toml --all-targets --all-features -- -D warnings
      - cargo --offline test --manifest-path native/Cargo.toml --all-targets
      - cargo --offline build --manifest-path native/Cargo.toml --release
      - install -Dm755 native/target/release/poe-recorder /app/bin/poe-recorder
      - install -d /app/share/poe-recorder
      - glib-compile-resources --sourcedir=data --target=/app/share/poe-recorder/spells.gresource data/spells.gresource.xml
      - install -Dm644 data/io.github.lapekataylor.PoeRecorder.desktop /app/share/applications/io.github.lapekataylor.PoeRecorder.desktop
      - install -Dm644 data/io.github.lapekataylor.PoeRecorder.metainfo.xml /app/share/metainfo/io.github.lapekataylor.PoeRecorder.metainfo.xml
      - install -Dm644 data/icons/io.github.lapekataylor.PoeRecorder.svg /app/share/icons/hicolor/scalable/apps/io.github.lapekataylor.PoeRecorder.svg
    sources:
      - type: dir
        path: ../native
        dest: native
      - type: dir
        path: ../data
        dest: data
      - type: dir
        path: ../tests/native
        dest: tests/native
      - cargo-sources.json
